[package]
name = "namu"
version = "0.1.0"
edition = "2021"
description = "Namu (나무) — 로컬 AI 채팅 · 프로젝트 에이전트"

[[bin]]
name = "Namu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
ureq = "2"

[profile.release]
lto = true
strip = true
opt-level = "s"
