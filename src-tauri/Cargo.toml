[package]
name = "namu"
version = "0.1.0"
edition = "2021"
description = "Namu (나무) — 로컬 AI 채팅 · 프로젝트 에이전트"

[[bin]]
name = "Namu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
futures-util = "0.3"
url = "2"
sha2 = "0.10"
tempfile = "3"
dom_query = "0.27"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
